<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNZE | OFFICIAL STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #222222;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 6px;
        }

        .cart-status {
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Announcement Bar */
        .status-bar {
            background-color: #111111;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: #ff3333;
            letter-spacing: 2px;
            border-bottom: 1px solid #222222;
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888888;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid #222222;
            padding: 15px;
            background-color: #050505;
            transition: border-color 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: #ffffff;
        }

        .product-image-container {
            width: 100%;
            height: 340px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
            padding: 10px;
        }

        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            text-align: right;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .product-price {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background-color: #cccccc;
        }

        /* Footer */
        footer {
            border-top: 1px solid #222222;
            padding: 30px 20px;
            text-align: center;
            color: #555555;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TNZE</div>
        <div class="cart-status">CART (0)</div>
    </header>

    <div class="status-bar">
        ● DROP 001 IS NOW LIVE / LIMITED QUANTITIES
    </div>

    <main>
        <div class="section-title">NEW ARRIVALS</div>

        <div class="products-grid">
            
            <!-- المنتج الأول: PROPERTY OF TNZE -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img1.png" alt="TNZE PROPERTY TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">PROPERTY OF TNZE TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    <button class="add-btn">ADD TO CART</button>
                </div>
            </div>

            <!-- المنتج الثاني: NORTH ZE STUDIO -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img2.png" alt="NORTH ZE STUDIO TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">NORTH ZE STUDIO LEOPARD TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    <button class="add-btn">ADD TO CART</button>
                </div>
            </div>

            <!-- المنتج الثالث: 745 PROTECT -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img3.png" alt="745 PROTECT TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">745 PROTECT CAMO TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    <button class="add-btn">ADD TO CART</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 TNZE. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
