<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNZE | OFFICIAL STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #222222;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 6px;
        }

        .cart-status {
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Announcement Bar */
        .status-bar {
            background-color: #111111;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: #ff3333;
            letter-spacing: 2px;
            border-bottom: 1px solid #222222;
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888888;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid #222222;
            padding: 15px;
            background-color: #050505;
            transition: border-color 0.3s ease, transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: #ffffff;
        }

        .product-image-container {
            width: 100%;
            height: 340px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
            padding: 10px;
        }

        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            text-align: right;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .product-price {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        /* Smooth Collapsible Size Selector Section */
        .size-selector-wrapper {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px);
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s ease,
                        transform 0.4s ease;
            margin-bottom: 0;
        }

        .size-selector-wrapper.active {
            max-height: 100px;
            opacity: 1;
            transform: translateY(0);
            margin-bottom: 15px;
        }

        .size-title {
            font-size: 0.8rem;
            color: #888888;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .sizes-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.25s ease;
        }

        .size-btn:hover {
            border-color: #888888;
        }

        .size-btn.selected {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .add-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .add-btn:hover {
            background-color: #cccccc;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            border-top: 1px solid #222222;
            padding: 30px 20px;
            text-align: center;
            color: #555555;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TNZE</div>
        <div class="cart-status" id="cartStatus">CART (0)</div>
    </header>

    <div class="status-bar">
        ● DROP 001 IS NOW LIVE / LIMITED QUANTITIES
    </div>

    <main>
        <div class="section-title">NEW ARRIVALS</div>

        <div class="products-grid">
            
            <!-- المنتج الأول: PROPERTY OF TNZE -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img1.png" alt="TNZE PROPERTY TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">PROPERTY OF TNZE TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    
                    <div class="size-selector-wrapper" id="sizes-1">
                        <div class="size-title">SELECT SIZE:</div>
                        <div class="sizes-list">
                            <button class="size-btn" onclick="selectSize(this)">S</button>
                            <button class="size-btn" onclick="selectSize(this)">M</button>
                            <button class="size-btn" onclick="selectSize(this)">L</button>
                            <button class="size-btn" onclick="selectSize(this)">XL</button>
                        </div>
                    </div>

                    <button class="add-btn" onclick="handleAddToCart(1, 'PROPERTY OF TNZE TEE', this)">ADD TO CART</button>
                </div>
            </div>

            <!-- المنتج الثاني: NORTH ZE STUDIO -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img2.png" alt="NORTH ZE STUDIO TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">NORTH ZE STUDIO LEOPARD TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    
                    <div class="size-selector-wrapper" id="sizes-2">
                        <div class="size-title">SELECT SIZE:</div>
                        <div class="sizes-list">
                            <button class="size-btn" onclick="selectSize(this)">S</button>
                            <button class="size-btn" onclick="selectSize(this)">M</button>
                            <button class="size-btn" onclick="selectSize(this)">L</button>
                            <button class="size-btn" onclick="selectSize(this)">XL</button>
                        </div>
                    </div>

                    <button class="add-btn" onclick="handleAddToCart(2, 'NORTH ZE STUDIO LEOPARD TEE', this)">ADD TO CART</button>
                </div>
            </div>

            <!-- المنتج الثالث: 745 PROTECT -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="img3.png" alt="745 PROTECT TEE">
                </div>
                <div class="product-info">
                    <div class="product-title">745 PROTECT CAMO TEE</div>
                    <div class="product-price">199.00 SAR</div>
                    
                    <div class="size-selector-wrapper" id="sizes-3">
                        <div class="size-title">SELECT SIZE:</div>
                        <div class="sizes-list">
                            <button class="size-btn" onclick="selectSize(this)">S</button>
                            <button class="size-btn" onclick="selectSize(this)">M</button>
                            <button class="size-btn" onclick="selectSize(this)">L</button>
                            <button class="size-btn" onclick="selectSize(this)">XL</button>
                        </div>
                    </div>

                    <button class="add-btn" onclick="handleAddToCart(3, '745 PROTECT CAMO TEE', this)">ADD TO CART</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 TNZE. ALL RIGHTS RESERVED.
    </footer>

    <script>
        let cartCount = 0;

        function selectSize(btn) {
            const parentList = btn.parentElement;
            parentList.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function handleAddToCart(productId, productName, addBtn) {
            const sizeWrapper = document.getElementById(`sizes-${productId}`);
            const isExpanded = sizeWrapper.classList.contains('active');

            if (!isExpanded) {
                // إظهار المقاسات بانسيابية
                sizeWrapper.classList.add('active');
                addBtn.innerText = "CONFIRM SIZE & ADD";
            } else {
                // التأكد من اختيار المقاس
                const selectedSizeBtn = sizeWrapper.querySelector('.size-btn.selected');
                if (!selectedSizeBtn) {
                    alert('يرجى اختيار المقاس أولاً');
                    return;
                }

                const selectedSize = selectedSizeBtn.innerText;
                cartCount++;
                document.getElementById('cartStatus').innerText = `CART (${cartCount})`;

                // تأكيد الإضافة لإعادة الزر لحالته
                addBtn.innerText = "ADDED ✓";
                addBtn.style.backgroundColor = "#228B22";
                addBtn.style.color = "#ffffff";

                setTimeout(() => {
                    sizeWrapper.classList.remove('active');
                    selectedSizeBtn.classList.remove('selected');
                    addBtn.innerText = "ADD TO CART";
                    addBtn.style.backgroundColor = "#ffffff";
                    addBtn.style.color = "#000000";
                }, 1500);
            }
        }
    </script>

</body>
</html>
