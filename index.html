<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNZE | VIP ACCESS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .status {
            color: #ff0000;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .lock-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #333333;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: #ffffff;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #cccccc;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #666666;
        }

        #errorMessage {
            color: #ff3333;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="logo">TNZE</div>
    <div class="status">● STORE CLOSED / NEXT DROP SOON</div>

    <form class="lock-form" id="accessForm">
        <input type="text" id="passcodeInput" placeholder="ENTER ACCESS CODE" required>
        <button type="submit">ENTER</button>
        <div id="errorMessage">رمز الدخول غير صحيح</div>
    </form>

    <div class="footer-note">
        انضم للقائمة البريدية أو انستغرام للحصول على رمز الدخول
    </div>

    <script>
        // رمز الدخول الخاص بالبراند
        const CORRECT_CODE = "TNZE 748";

        document.getElementById('accessForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('passcodeInput').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            if (inputVal.toUpperCase() === CORRECT_CODE.toUpperCase()) {
                alert('تم الدخول بنجاح! سيتم تحويلك إلى متجر TNZE...');
                // window.location.href = "shop.html";
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
