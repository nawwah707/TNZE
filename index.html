<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNZE | OFFICIAL STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #222222;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 5px;
        }

        .cart-status {
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Banner */
        .status-bar {
            background-color: #111111;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 2px;
            border-bottom: 1px solid #222222;
        }

        /* Products Grid */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid #222222;
            padding: 15px;
            background-color: #050505;
            transition: border-color 0.3s;
        }

        .product-card:hover {
            border-color: #ffffff;
        }

        .product-image {
            width: 100%;
            height: 320px;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555555;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .product-price {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background-color: #cccccc;
        }

        /* Footer */
        footer {
            border-top: 1px solid #222222;
            padding: 30px 20px;
            text-align: center;
            color: #555555;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TNZE</div>
        <div class="cart-status">CART (0)</div>
    </header>

    <div class="status-bar">
        ● DROP 001 IS NOW LIVE / LIMITED QUANTITIES
    </div>

    <main>
        <div class="products-grid">
            <!-- المنتج الأول -->
            <div class="product-card">
                <div class="product-image">[ صورة المنتج 1 ]</div>
                <div class="product-title">TNZE HEAVY HOODIE - BLACK</div>
                <div class="product-price">280 SAR</div>
                <button class="add-btn">ADD TO CART</button>
            </div>

            <!-- المنتج الثاني -->
            <div class="product-card">
                <div class="product-image">[ صورة المنتج 2 ]</div>
                <div class="product-title">TNZE OVERSIZED TEE</div>
                <div class="product-price">160 SAR</div>
                <button class="add-btn">ADD TO CART</button>
            </div>

            <!-- المنتج الثالث -->
            <div class="product-card">
                <div class="product-image">[ صورة المنتج 3 ]</div>
                <div class="product-title">TNZE CARGO PANTS</div>
                <div class="product-price">310 SAR</div>
                <button class="add-btn">ADD TO CART</button>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 TNZE. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
